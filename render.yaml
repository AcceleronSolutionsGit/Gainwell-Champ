# render.yaml — Render Blueprint for one-click deployment
# https://render.com/docs/blueprint-spec
#
# After connecting the repo, Render reads this file and provisions the service.
# Set the environment variables in the Render dashboard after deploy.

services:
  - type: web
    name: gainwell-champ
    runtime: node
    region: singapore  # closest to India
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_CLIENT
        value: better-sqlite3
      - key: SQLITE_FILE
        value: /opt/render/project/src/data/champ.sqlite3
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: gainwellengineering.com,acceleronsolutions.io
      - key: ADMIN_EMAILS
        value: hr.admin@gainwellengineering.com,sabarnik.lahiri@acceleronsolutions.io
      - key: COMMITTEE_EMAILS
        value: rnr.committee@gainwellengineering.com
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        value: no-reply@gainwellengineering.com
      - key: WHATSAPP_PROVIDER
        sync: false  # Set manually in dashboard
      - key: META_WA_API_VERSION
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_APP_SECRET
        sync: false
      - key: META_WA_VERIFY_TOKEN
        sync: false
    healthCheckPath: /api/health
    disk:
      name: champ-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
